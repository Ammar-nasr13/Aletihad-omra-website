<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <title>تسجيل الدخول | لوحة تحكم الاتحاد للعمرة</title>
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-logo-container">
            <img src="images/logo.png" alt="شعار الاتحاد" class="login-logo-img">
            <h1 class="login-title">الاتحاد لخدمات المعتمرين</h1>
            <p class="login-subtitle">لوحة الإدارة والمتابعة الآمنة</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="login-form-group">
                <label for="username">اسم المستخدم</label>
                <div class="login-input-wrapper">
                    <i class="fa-solid fa-user input-icon" aria-hidden="true"></i>
                    <input type="text" id="username" name="username" required placeholder="أدخل اسم المستخدم" autocomplete="username">
                </div>
            </div>

            <div class="login-form-group">
                <label for="password">كلمة المرور</label>
                <div class="login-input-wrapper">
                    <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
                    <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور" autocomplete="current-password">
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword" aria-hidden="true" title="عرض كلمة المرور"></i>
                </div>
            </div>

            <div class="login-error-msg" id="errorMsg">اسم المستخدم أو كلمة المرور غير صحيحة!</div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span>تسجيل الدخول</span>
            </button>
        </form>
    </div>

    <!-- Appwrite Web SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <!-- Database Service -->
    <script src="appwrite-db.js"></script>
    <!-- Page Logic -->
    <script src="login.js"></script>
</body>
</html>
